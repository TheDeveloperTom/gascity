name: fork-verify

# Minimal fork-only CI for gascity forks. Verifies WIP feature branches
# WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.6.0"
      BD_VERSION: "v1.3.4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: Unit tests — tests added or changed by #8178 / #9357
        run: go test ./cmd/gc -run '^(TestComputePoolDesiredStates|TestApplyNestedCaps_WakeKnownIdentityRanksBeforeNew|TestDecideAndLegacyFreshWakeSkipBlockedAssignedStep|TestCityRuntimeDemandSnapshotFreshWake|TestBuildDesiredState_FreshWakeSkipsBlockedAssignedStep|TestBuildDesiredState_BlockedFreshSessionMaterializesRunnableReplacement|TestFilterAssignedWorkBeadsForPoolDemand|TestFreshWakeDemandUsesEachRowsOwnStoreReadiness|TestPoolDemandFilter|TestAllocationDifferential|TestLegacyScaleCheckTimeoutIsAFailedCheck|TestSessionDifferential|TestEveryKeptBehaviorOfARegisteredArmHasAParityFixture|TestKeptGateBindsAKindOnceARegisteredArmProposesIt|TestTimelineExplainsAreStepScoped|TestFreshDrainBeginsReachAdmission|TestIdleProbesPaceAPatrolApart|TestIdlePaceHoldsOnlyIdleProbes)' -count=1 -v
      - name: Unit tests — broader pool / desired-state / wake / reconcile
        run: go test ./cmd/gc -run 'PoolDesired|DesiredState|Parked|Wake|Reconcile' -count=1
      - name: Split-strict gate — fresh-wake tests under GC_TEST_SPLIT_STRICT=1 (known-failures list from #9357)
        env:
          GC_TEST_SPLIT_STRICT: "1"
        run: go test ./cmd/gc -run '^(TestComputePoolDesiredStates|TestDecideAndLegacyFreshWakeSkipBlockedAssignedStep|TestCityRuntimeDemandSnapshotFreshWake|TestBuildDesiredState_FreshWakeSkipsBlockedAssignedStep|TestFilterAssignedWorkBeadsForPoolDemand|TestFreshWakeDemandUsesEachRowsOwnStoreReadiness)' -count=1 -v
