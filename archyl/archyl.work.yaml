    {
      "name": "Gates",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "Things that hold work until something external happens. Formula [steps.gate] compiles to a gate bead that blocks the step (type stored verbatim in gc.gate_type, no engine-side resolver); human gates are served by two core-pack exec orders that mail+nudge the addressee on creation and re-nudge while open; durable session waits (gc wait / gc session wait) are gate beads in the sessions class; convergence loops have manual/condition/hybrid gates. Source: internal/formula/compile.go:515 (step.Gate), internal/beadmeta/keys.go:241 (gc.gate_type), internal/bootstrap/packs/core/orders/notify-on-human-gate-creation.toml:27-31 (bead.created), internal/coordclass/class.go:79 (gc:wait), internal/convergence/gate.go:17 (GateConfig).",
