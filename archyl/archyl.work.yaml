      "style": {"background_color": "#438dd5", "shape": "box"},
      "components": [
        {
          "name": "FormulaParser",
          "type": "module",
          "description": "Finds a formula by name across layers (last layer wins), parses TOML and resolves extends/compose. Source: internal/formula/resolve.go:25 (Resolve), internal/formula/parser.go:65 (NewParser), internal/formula/parser.go:119 (ParseFile), internal/formula/parser.go:245 (Resolve)."
        },
        {
          "name": "FormulaCompiler",
