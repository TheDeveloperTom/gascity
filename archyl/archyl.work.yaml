          "name": "GateStepCompiler",
          "type": "module",
          "description": "For a step with [steps.gate] emits a gate RecipeStep <parent>.gate-<step> of type gate with gc.gate_type = declared type; it blocks the gated step. Source: internal/formula/compile.go:515 (step.Gate), internal/formula/compile.go:526 (Type:        \"gate\"), internal/formula/compile.go:534 (GateTypeMetadataKey)."
        },
