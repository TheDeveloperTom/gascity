{
  "containers": [
    {
      "name": "Mail and nudge",
      "parent_system": "Gas City engine",
      "type": "message_queue",
      "description": "Agent-to-agent (and human) messaging. Mail is message beads in the messaging class behind a mail.Provider (bead-backed by default); `gc mail send --notify` also requests a recipient turn. Nudges are short prompts queued durably (one nudge = one bead in the nudges class) and delivered into live sessions by the controller or drained by the agent's UserPromptSubmit hook. Source: internal/mail/mail.go:127 (Provider), internal/mail/beadmail/beadmail.go:46 (Provider), cmd/gc/cmd_mail.go:1866 (newMailSendCmd), internal/storebinding/beads_nudge_queue.go:1 (nudge queue as BEADS), cmd/gc/nudge_dispatcher.go:115 (dispatchAllQueuedNudges).",
      "technologies": ["Go"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "pipe"},
      "components": [
        {
          "name": "MailProvider",
          "type": "adapter",
          "description": "mail.Provider interface and the bead-backed implementation (messages as beads, recipients resolved through the session address directory); an exec provider exists for external mail backends. Source: internal/mail/mail.go:127 (Provider), internal/mail/beadmail/beadmail.go:46 (Provider), internal/mail/beadmail/beadmail.go:72 (NewWithSessionDirectory), internal/mail/exec/exec.go:1 (package exec)."
        },
        {
          "name": "MailSendCommand",
          "type": "controller",
          "description": "`gc mail send [--notify]`: resolves the recipient (session alias, configured mailbox, or \"human\"), writes the message, and with --notify asks for a recipient turn through the nudge path (skipped for \"human\"). Source: cmd/gc/cmd_mail.go:1866 (newMailSendCmd), cmd/gc/cmd_mail.go:1915 (notify), cmd/gc/cmd_mail.go:2151 (cmdMailSend), cmd/gc/cmd_mail.go:2247 (newMailNudgeFunc)."
        },
        {
          "name": "MailCheckCommand",
          "type": "controller",
          "description": "`gc mail check [--inject]`: reports unread mail for $GC_SESSION_ID/$GC_ALIAS/$GC_AGENT (or human); with --inject prints it into the agent's turn from a hook. Source: cmd/gc/cmd_mail.go:525 (newMailCheckCmd), cmd/gc/cmd_mail.go:536 (human)."
        },
        {
          "name": "NudgeQueue",
          "type": "repository",
          "description": "Durable nudge queue: items with pending / in-flight / dead / terminal states, stored as beads with CAS primitives. Source: internal/nudgequeue/state.go:36 (Item), internal/nudgequeue/state.go:111 (State), internal/storebinding/beads_nudge_queue.go:5 (one queued)."
        },
        {
          "name": "NudgeQueueDispatcher",
          "type": "job",
          "description": "Controller-side delivery of queued nudges to their target sessions through the runtime provider, with a wake listener for immediate dispatch. Source: cmd/gc/nudge_dispatcher.go:58 (startNudgeWakeListener), cmd/gc/nudge_dispatcher.go:115 (dispatchAllQueuedNudges), cmd/gc/nudge_dispatcher.go:128 (dispatchQueuedNudges)."
        },
        {
          "name": "SessionNudgeDelivery",
          "type": "service",
          "description": "`gc nudge` delivery into a session: queue or immediate, keyed for idempotency, ending in the provider's Nudge. Source: cmd/gc/cmd_nudge.go:316 (newNudgeCmd), cmd/gc/cmd_nudge.go:1408 (deliverSessionNudge), internal/runtime/nudge_delivery.go:103 (NudgeWithDeliveryKey)."
        },
        {
          "name": "NudgeDrainCommand",
          "type": "controller",
          "description": "`gc nudge drain --inject`: drains this session's queued nudges into the current turn (called from Claude's UserPromptSubmit hook). Source: cmd/gc/cmd_nudge.go:367 (newNudgeDrainCmd), cmd/gc/cmd_nudge.go:745 (cmdNudgeDrainWithFormat)."
        }
      ]
    },
    {
      "name": "Bead store integration",
      "parent_system": "Gas City engine",
      "type": "database",
      "description": "Everything durable is a bead. beads.Store is the interface; backends are BdStore (bd CLI subprocess), NativeDoltStore (beads Go library over Dolt) and SQLiteStore (in-process modernc SQLite), wrapped by a CachingStore that emits bead.* events. Coordination classes (work, graph, messaging, sessions, orders, nudges) can be split onto different bindings; a born-split city keeps work on Dolt and the five infrastructure classes on one SQLite binding. `gc bd` passes raw bd commands through with the right rig and env. Source: internal/beads/beads.go:1069 (Store), internal/beads/bdstore.go:472 (BdStore), internal/beads/native_dolt_store.go:362 (NativeDoltStore), internal/beads/sqlite_store.go:232 (SQLiteStore), internal/coordclass/class.go:56 (Class), cmd/gc/init_storage.go:72 (bornSplitStorageConfig).",
      "technologies": ["Go", "bd CLI subprocess", "Dolt SQL (beads library)", "SQLite (modernc.org/sqlite)"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "cylinder"},
      "components": [
        {
          "name": "BeadStoreInterface",
          "type": "module",
          "description": "beads.Store and its capability interfaces (atomic tx, graph apply, conditional writes) used by every subsystem. Source: internal/beads/beads.go:736 (AtomicTxStore), internal/beads/beads.go:1069 (Store), internal/beads/beads.go:1257 (StorageGraphApplyStore)."
        },
        {
          "name": "BdStore",
          "type": "adapter",
          "description": "Store implemented by running the bd binary in a directory with an env; used for scoped stores and hook claims. Source: internal/beads/bdstore.go:472 (BdStore), internal/beads/bdstore.go:610 (NewBdStore), internal/beads/bdstore.go:138 (exec.CommandContext), cmd/gc/scoped_store.go:36 (NewBdStore)."
        },
        {
          "name": "NativeDoltStore",
          "type": "adapter",
          "description": "Store over the beads Go library (beadslib.Storage) connected to the Dolt server, with reconnect-on-transient-error. Opened for the city work ledger. Source: internal/beads/native_dolt_store.go:362 (NativeDoltStore), internal/beads/native_dolt_store.go:620 (OpenNativeDoltStoreAt), cmd/gc/main.go:1958 (OpenNativeDoltStoreAt)."
        },
        {
          "name": "SQLiteStore",
          "type": "adapter",
          "description": "In-process SQLite bead store (beads.sqlite) for split infrastructure classes. Source: internal/beads/sqlite_store.go:23 (modernc.org/sqlite), internal/beads/sqlite_store.go:232 (SQLiteStore), internal/beads/sqlite_store.go:264 (OpenSQLiteStore), cmd/gc/init_storage.go:84 (sqlite-beads)."
        },
