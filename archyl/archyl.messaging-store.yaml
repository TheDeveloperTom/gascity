      "parent_system": "Gas City engine",
      "type": "file_storage",
      "description": "Tier-0 observability bus: the recorder appends JSON lines to .gc/events.jsonl (rotated, best-effort); readers scan back with cursors; the supervisor multiplexes all cities' event providers for /v0/events/stream; event-triggered orders consume it. Source: internal/events/events.go:1-6 (.gc/events.jsonl), internal/events/recorder.go:57 (FileRecorder), internal/events/multiplexer.go:36 (Multiplexer), cmd/gc/cmd_events.go:150 (newEventsCmd).",
