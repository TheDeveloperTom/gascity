          "type": "module",
          "description": "Classifies each bead into a coordination class and hands each subsystem the store bound to its class; emits bead.created/updated/closed for class-store writes. Source: internal/coordclass/class.go:56 (Class), internal/coordclass/classify.go:123 (Classify), cmd/gc/class_store.go:21 (per-class store refactor), cmd/gc/class_store_emit.go:365 (events.BeadCreated)."
        },
        {
          "name": "BdPassthrough",
          "type": "controller",
          "description": "`gc bd [bd-args...]`: runs bd in the rig dir that owns the bead prefix, with gc's env pinned (used by pack scripts and agents). Source: cmd/gc/cmd_bd.go:70 (newBdCmd), cmd/gc/cmd_bd.go:177 (bdCommandEnv)."
        },
