{
  "containers": [
    {
      "name": "gc CLI",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "The cobra command tree of the gc binary: ~70 built-in commands registered on one root, plus pack-defined commands discovered from the city's packs. Most commands are thin front doors onto the subsystems below (mail, sling, order, doctor, bd, ...); the ones listed as components here are the cross-cutting ones agents and hooks call. Source: cmd/gc/main.go:33 (main), cmd/gc/main.go:314 (newRootCmdWithOptions), cmd/gc/main.go:359 (AddCommand), cmd/gc/cmd_pack_commands.go:145 (resolvePackCommandFallback).",
      "technologies": ["Go", "cobra CLI"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#1168bd", "shape": "box"},
      "components": [
        {
          "name": "RootCommand",
          "type": "controller",
          "description": "Builds the root `gc` command, the persistent --city/--rig/--context/--city-url flags and registers every built-in subcommand. Source: cmd/gc/main.go:314 (newRootCmdWithOptions), cmd/gc/main.go:347 (cityFlag), cmd/gc/main.go:359 (AddCommand)."
        },
        {
          "name": "PackCommandDispatch",
          "type": "adapter",
          "description": "Runs commands that packs declare under commands/ (city verbs); an unknown first argument falls back to a fresh pack-command discovery. Source: cmd/gc/main.go:333 (resolvePackCommandFallback), cmd/gc/cmd_pack_commands.go:145 (resolvePackCommandFallback)."
        },
        {
          "name": "StartCommand",
          "type": "controller",
          "description": "`gc start`: fetches packs, registers the city with the machine-wide supervisor, ensures the supervisor runs and triggers reconciliation; also runs stage-1 skill materialisation. Source: cmd/gc/cmd_start.go:429 (newStartCmd), cmd/gc/cmd_start.go:435 (Start the city), cmd/gc/cmd_start.go:967 (runStage1SkillMaterialization)."
        },
        {
          "name": "PrimeCommand",
          "type": "controller",
          "description": "`gc prime [agent]` (and `--hook` from Claude's SessionStart): resolves the agent and renders its prompt template to stdout; reports the prompt delivery budget. Source: cmd/gc/cmd_prime.go:65 (newPrimeCmd), cmd/gc/cmd_prime.go:287 (doPrimeWithHookFormatOpts), cmd/gc/cmd_prime.go:1150 (renderPromptWithMeta), cmd/gc/cmd_prime.go:184 (promptDelivery)."
        },
        {
          "name": "HookCommand",
          "type": "controller",
          "description": "`gc hook [agent]` finds routed work for an agent (the work-discovery front door used in prompts and hooks); `gc hook run` wraps hook commands with a timeout. Source: cmd/gc/cmd_hook.go:28 (newHookCmd), cmd/gc/cmd_hook.go:36 (Find routed work), cmd/gc/cmd_hook.go:121 (newHookRunCmd), cmd/gc/cmd_hook.go:300 (cmdHook)."
        },
        {
          "name": "HandoffCommand",
          "type": "controller",
          "description": "`gc handoff`: sends handoff mail to self and, for a controller-restartable session, requests a restart and pokes the controller. Wired to Claude's PreCompact hook as `gc handoff --auto \"context cycle\"`. Source: cmd/gc/cmd_handoff.go:22 (newHandoffCmd), cmd/gc/cmd_handoff.go:31 (Send handoff mail), cmd/gc/cmd_handoff.go:171 (cmdHandoff)."
        }
      ]
    },
    {
      "name": "Supervisor",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "The machine-wide long-running process (`gc supervisor run`): reads the city registry, starts/stops one CityRuntime per registered city, hosts the unified API mux, and is kept alive by launchd/systemd. Source: cmd/gc/cmd_supervisor.go:46 (newSupervisorCmd), cmd/gc/cmd_supervisor.go:1496 (runSupervisor), cmd/gc/cmd_supervisor.go:1975 (reconcileCities), cmd/gc/cmd_supervisor.go:1621 (NewSupervisorMux).",
      "technologies": ["Go"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "box"},
      "components": [
        {
          "name": "SupervisorMain",
          "type": "service",
          "description": "runSupervisor: refuses a second live supervisor, loads supervisor.toml, opens the registry, builds the API mux and loops reconcileCities. Source: cmd/gc/cmd_supervisor.go:1496 (runSupervisor), cmd/gc/cmd_supervisor.go:1500 (supervisorAlive), cmd/gc/cmd_supervisor.go:346 (supervisorLoadConfig)."
        },
        {
          "name": "CityRegistry",
          "type": "repository",
          "description": "~/.gc/cities.toml registry of cities (supervisor.Registry) plus the in-process cityRegistry of managed cities. Source: internal/supervisor/registry.go:72 (NewRegistry), internal/supervisor/config.go:300 (RegistryPath), cmd/gc/city_registry.go:198 (Add)."
        },
        {
          "name": "CityReconciler",
          "type": "controller",
          "description": "reconcileCities: diffs registry entries against running cities and starts a CityRuntime for each new one (newCityRuntime). Source: cmd/gc/cmd_supervisor.go:1975 (reconcileCities), cmd/gc/cmd_supervisor.go:2487 (newCityRuntime)."
        },
        {
          "name": "ServiceManagerIntegration",
          "type": "adapter",
          "description": "launchd/systemd awareness for `gc supervisor` lifecycle commands: detects unsupervised runs and prints remedies. Source: cmd/gc/cmd_supervisor_lifecycle.go:310 (supervisorLaunchdSupervisionWarning), cmd/gc/cmd_supervisor_lifecycle.go:342 (supervisorLaunchdRemedy)."
        }
      ]
    },
    {
      "name": "City controller (CityRuntime)",
      "parent_system": "Gas City engine",
      "type": "worker",
      "description": "One reconciler per city: a patrol-tick loop that reloads config on file change, builds desired state (which sessions should exist, with which TemplateParams), reconciles session beads against runtimes (start/stop/drain), runs orders, nudges, convergence and wisp GC, and accepts commands on a per-city Unix socket. Source: cmd/gc/controller.go:1375 (controllerLoop), cmd/gc/city_runtime.go:519 (newCityRuntime), cmd/gc/city_runtime.go:690 (run), cmd/gc/city_runtime.go:1456 (tick).",
      "technologies": ["Go", "fsnotify", "Unix socket"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "box"},
      "components": [
        {
          "name": "PatrolTickLoop",
          "type": "controller",
          "description": "CityRuntime.run / tick: runs the ordered tick phases (config reload, pool deaths, session snapshot, reaping, desired state + sync, bead reconcile, wisp GC, convergence ...) under a panic guard. Source: cmd/gc/city_runtime.go:690 (run), cmd/gc/city_runtime.go:1456 (tick), cmd/gc/city_runtime.go:1438 (runTickPhases), cmd/gc/city_runtime.go:1157 (safeTick)."
        },
        {
          "name": "ConfigWatchAndReload",
          "type": "service",
          "description": "fsnotify watch of city.toml, includes and pack convention dirs; on change the tick re-runs the full config load (bundled packs refreshed first) and applies it, then re-materialises skills. Source: cmd/gc/controller.go:788 (watchConfigTargets), cmd/gc/controller.go:961 (tryReloadConfig), cmd/gc/controller.go:978 (LoadWithIncludes), cmd/gc/city_runtime.go:1559 (tickConfigReload), cmd/gc/city_runtime.go:3179 (runStage1SkillMaterialization)."
        },
        {
          "name": "ControllerSocket",
          "type": "handler",
          "description": "Per-city control socket: reload, converge, session circuit reset and identity probes sent by CLI commands. Source: cmd/gc/controller.go:117 (controllerSocketPath), cmd/gc/controller.go:147 (startControllerSocket), cmd/gc/controller.go:194 (handleControllerConn), cmd/gc/controller.go:553 (sendControllerCommand)."
        },
        {
          "name": "DesiredStateBuilder",
          "type": "service",
          "description": "buildDesiredState: for every configured agent/pool/named session computes the desired session set and resolves its TemplateParams (prompt, command, env, pre_start, work dir) via resolveTemplate; installs provider hooks into work dirs on the way. Source: cmd/gc/build_desired_state.go:449 (buildDesiredState), cmd/gc/build_desired_state.go:7765 (resolveTemplate), cmd/gc/build_desired_state.go:7669 (InstallWithResolver)."
        },
        {
          "name": "SessionReconciler",
          "type": "controller",
          "description": "Bead-driven wake/sleep reconciliation: one session bead per session; computes whether each should be awake and drives lifecycle transitions; launches go through startLaunch which calls the runtime provider's Start. Source: cmd/gc/session_reconciler.go:1 (session_reconciler.go implements), cmd/gc/session_reconciler.go:1896 (reconcileSessionBeadsAtPathWithNamedDemand), cmd/gc/city_runtime.go:1890 (tickBeadReconcile), cmd/gc/reconcile_effect_launch.go:317 (startLaunch), cmd/gc/reconcile_effect_launch.go:353 (leaf.Start)."
        },
        {
          "name": "OrdersLaneTick",
          "type": "job",
          "description": "Tick lane that runs the city's order dispatcher each patrol and rescans orders when packs change. Source: cmd/gc/orders_lane.go:313 (cr.od.dispatch), cmd/gc/city_runtime.go:2155 (rescanOrderDispatcher)."
        },
        {
          "name": "NudgeDispatchTick",
          "type": "job",
          "description": "Tick step that drains the durable nudge queue into live sessions. Source: cmd/gc/city_runtime.go:3748 (runNudgeDispatchTick), cmd/gc/nudge_dispatcher.go:115 (dispatchAllQueuedNudges)."
        },
        {
          "name": "ConvergenceTick",
          "type": "job",
          "description": "Tick step that processes convergence-loop requests and evaluates their gates. Source: cmd/gc/city_runtime.go:2000 (tickProcessConvergenceRequests), cmd/gc/city_runtime.go:2008 (tickConvergence)."
        }
      ]
    },
    {
      "name": "Op journal and work ladder",
      "parent_system": "Gas City engine",
      "type": "worker",
      "description": "Durable controller bookkeeping on beads: the conversation operation journal (op/fact/runtime rows in the sessions class store, swept by the controller) and the per-seat work-progress ladder that decides nudge / recycle / release of claimed work with a never-zero backoff. Source: internal/opjournal/doc.go:1 (Package opjournal), cmd/gc/op_sweep.go:158 (startOpSweep), internal/workladder/decide.go:35 (Decide), cmd/gc/work_ladder_lane.go:73 (workladder.Decide).",
      "technologies": ["Go"],
      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "box"},
      "components": [
        {
          "name": "OpJournalStore",
          "type": "repository",
          "description": "Op rows (gc:op), fact rows (gc:fact) and one runtime row per conversation, stored as beads of type op in the sessions class; ready-excluded so they never reach work queries. Source: internal/opjournal/doc.go:12 (Rows), internal/opjournal/doc.go:15 (L1 rows), internal/opjournal/store.go:1 (package opjournal)."
        },
        {
          "name": "OpSweeper",
          "type": "job",
          "description": "Controller goroutine that sweeps the op journal under rollout flags (off/auto/require modes). Source: cmd/gc/op_sweep.go:123 (newOpSweeper), cmd/gc/op_sweep.go:158 (startOpSweep), cmd/gc/op_sweep.go:301 (sweep)."
        },
        {
          "name": "WorkLadderPolicy",
          "type": "config",
          "description": "Ladder parameters: grace 90s, base 3m doubling to a 60m cap, 24h wait cap, recycle/claim/started thresholds. Source: internal/workladder/policy.go:8 (DefaultGrace), internal/workladder/policy.go:10 (DefaultCap), internal/workladder/policy.go:17 (DefaultTriggerThreshold)."
        },
        {
          "name": "WorkLadderLane",
          "type": "controller",
          "description": "Per seat and pass: observe claim/row/runtime/turns, decide (pure workladder.Decide), CAS the cell, then nudge, post a recycle or release an unstarted claim. Source: cmd/gc/work_ladder_lane.go:3 (work-progress ladder), cmd/gc/work_ladder_lane.go:73 (workladder.Decide), internal/workladder/decide.go:35 (Decide)."
        }
      ]
    }
  ],
