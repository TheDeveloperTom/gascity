  "systems": [
    {
      "name": "Gas City engine",
      "type": "software_system",
      "description": "The gc binary built from TheDeveloperTom/gascity at 918a0c252: one Go program that is both the CLI (cobra command tree) and the long-running machine-wide supervisor that hosts one controller (CityRuntime) per registered city, the typed /v0 API and the embedded dashboard. It composes city.toml + packs into a config, reconciles agent sessions in tmux/subprocess/acp runtimes, materialises skills/MCP/Claude settings into work dirs, runs formulas v2 as bead molecules, dispatches orders, routes mail and nudges, and stores everything as beads (bd/Dolt/SQLite). Source: cmd/gc/main.go:33 (main), cmd/gc/main.go:314 (newRootCmdWithOptions), cmd/gc/cmd_supervisor.go:1496 (runSupervisor), go.mod:28 (github.com/steveyegge/beads)."
    },
    {
      "name": "City directory",
      "type": "external_system",
      "description": "The operator's city on disk: city.toml with [[patches.agent]] and includes, the city pack (pack.toml, agents/<name>/, formulas/, orders/, skills/), and the runtime dir .gc/ (events.jsonl, settings.json, store/). Read by config composition, written by materialisers. Source: internal/config/compose.go:147 (LoadWithIncludesOptions), internal/hooks/hooks.go:662 (runtimeDst), internal/events/events.go:5 (.gc/events.jsonl), cmd/gc/init_storage.go:84 (initSplitBindingName).",
      "technologies": ["filesystem", "TOML"]
    },
    {
