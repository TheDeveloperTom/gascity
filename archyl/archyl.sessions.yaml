        },
        {
          "name": "AssignedSkillsAppendix",
          "type": "module",
          "description": "When the provider has a skills sink, appends to the prompt a list of the skills this agent will see: the shared catalog plus the agent catalog loaded from agent.SkillsDir (so for a pack agent, the pack's role skills). Source: cmd/gc/template_resolve.go:534 (SkillsDir), cmd/gc/template_resolve.go:540 (LoadAgentCatalog), cmd/gc/skill_integration.go:323 (buildAssignedSkillsPromptFragment)."
        },
        {
          "name": "ProviderLaunchCommand",
