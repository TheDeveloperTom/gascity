          "type": "module",
          "description": "Chooses argv suffix, flag or nudge for the startup prompt; refuses argv at >= 100 000 raw or 128 000 quoted bytes (a runtime can opt into nudge-fallback). Source: cmd/gc/prompt_delivery.go:21 (maxPromptSuffixRawBytes), cmd/gc/prompt_delivery.go:174 (promptDelivery), cmd/gc/prompt_delivery.go:102 (promptDeliverySupportFor)."
        }
      ]
    },
    {
