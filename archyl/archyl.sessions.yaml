{
  "containers": [
    {
      "name": "Agent launch assembly",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "Turns one configured agent into a launchable session spec (TemplateParams -> runtime.Config): renders the prompt template with fragments and the assigned-skills appendix, builds the provider launch command (claude ... --settings <city>/.gc/settings.json), appends gc's own pre_start steps for skill and MCP delivery, and decides how the prompt is delivered (argv, flag or nudge, argv capped at 100 000 raw bytes). Source: cmd/gc/template_resolve.go:202 (resolveTemplate), cmd/gc/prompt.go:116 (renderPrompt), internal/config/launch_command.go:31 (BuildProviderLaunchCommand), cmd/gc/prompt_delivery.go:174 (promptDelivery).",
