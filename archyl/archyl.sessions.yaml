      "tags": ["source: code 918a0c252"],
      "style": {"background_color": "#438dd5", "shape": "box"},
      "components": [
        {
          "name": "TemplateResolver",
          "type": "service",
          "description": "resolveTemplate: per agent and session computes work dir, env, launch command, rendered prompt, pre_start (authored + gc-appended), fingerprint inputs. Source: cmd/gc/template_resolve.go:202 (resolveTemplate), cmd/gc/template_resolve.go:466 (renderPrompt), cmd/gc/template_resolve.go:724 (appendMaterializeSkillsPreStart), cmd/gc/template_resolve.go:791 (appendProjectMCPPreStart), cmd/gc/template_resolve.go:1013 (templateParamsToConfigWithDelivery)."
        },
        {
          "name": "PromptRenderer",
