      "components": [
        {
          "name": "ProviderHookInstaller",
          "type": "service",
          "description": "Install / InstallWithResolver: per provider family writes managed hook files or overlays (claude, codex, gemini, cursor, opencode, pi, omp, kiro ...), upgrading stale generated copies. Source: internal/hooks/hooks.go:186 (SupportedProviders), internal/hooks/hooks.go:256 (Install), internal/hooks/hooks.go:265 (InstallWithResolver), internal/hooks/hooks.go:323 (installOverlayManaged)."
        },
        {
          "name": "ClaudeSettingsWriter",
          "type": "service",
          "description": "installClaude: picks the user source (.claude/settings.json, then hooks/claude.json, then .gc/settings.json), merges it over the embedded defaults (hook events unioned) and writes <city>/.gc/settings.json. Source: internal/hooks/hooks.go:653-656 (.claude/settings.json), internal/hooks/hooks.go:660 (installClaude), internal/hooks/hooks.go:662 (runtimeDst), internal/hooks/hooks.go:768 (desiredClaudeSettings), internal/overlay/merge.go:111 (MergeSettingsJSON)."
        },
        {
          "name": "EmbeddedClaudeHooks",
          "type": "config",
          "description": "Embedded default Claude settings: skipDangerousModePermissionPrompt, enableAllProjectMcpServers; SessionStart(matcher startup) gc prime --hook; PreCompact gc handoff --auto \"context cycle\"; UserPromptSubmit gc hook run -- nudge drain --inject and -- mail check --inject. Source: internal/hooks/config/claude.json:2-3 (skipDangerousModePermissionPrompt), internal/hooks/config/claude.json:7-13 (SessionStart), internal/hooks/config/claude.json:18-24 (PreCompact), internal/hooks/config/claude.json:29-39 (UserPromptSubmit)."
        }
      ]
    }
