    {
      "name": "Skill and MCP materialisation",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "Delivers skills and MCP servers to agents without translating them: skills are symlinked from catalogs (shared pack skills/ + agent-local agents/<name>/skills from agent.SkillsDir) into the provider's sink (.claude/skills, .agents/skills, ...); MCP definitions from pack mcp/ dirs and agent.MCPDir are projected into the provider's native file (.mcp.json for Claude). Stage 1 runs in the controller on the scope root; stage 2 runs in the session's pre_start (`gc internal materialize-skills`, `gc internal project-mcp`). Source: cmd/gc/skill_supervisor.go:35 (runStage1SkillMaterialization), internal/materialize/skills.go:512 (Run), internal/materialize/mcp_runtime.go:25 (EffectiveMCPForSession), internal/materialize/mcp_project.go:49 (BuildMCPProjection).",
      "technologies": ["Go", "symlink", "JSON"],
      "tags": ["source: code 918a0c252", "fact 18.11: pack agent skills from SourceDir"],
      "style": {"background_color": "#85bbf0", "shape": "box"},
      "components": [
        {
          "name": "SkillCatalogs",
          "type": "repository",
          "description": "Shared city catalog (pack skills/ dirs, rig-import skills only in that rig) and the agent catalog loaded from agent.SkillsDir; EffectiveSet merges them, agent entries win on a name clash. Source: cmd/gc/skill_catalog.go:10 (sharedSkillCatalogInputs), internal/materialize/skills.go:211 (LoadCityCatalog), internal/materialize/skills.go:319 (LoadAgentCatalog), internal/materialize/skills.go:338 (EffectiveSet)."
        },
        {
          "name": "Stage1SkillMaterializer",
          "type": "job",
          "description": "Controller-side pass over all agents whose runtime shares the host filesystem: loads LoadAgentCatalog(agent.SkillsDir), merges with the shared catalog and symlinks into <scope root>/<vendor sink>. Called from gc start, the supervisor and every config reload. Source: cmd/gc/skill_supervisor.go:35 (runStage1SkillMaterialization), cmd/gc/skill_supervisor.go:77 (stage1SkillRequests), cmd/gc/skill_supervisor.go:117 (LoadAgentCatalog), cmd/gc/skill_integration.go:82 (canStage1Materialize)."
        },
        {
          "name": "Stage2SkillMaterializer",
          "type": "job",
          "description": "`gc internal materialize-skills`, appended to the session's pre_start, materialises the same effective set into the session work dir when it differs from the scope root. Source: cmd/gc/cmd_internal_materialize_skills.go:43 (newInternalMaterializeSkillsCmd), cmd/gc/cmd_internal_materialize_skills.go:165 (materializeSkillsIntoWorkdir), cmd/gc/cmd_internal_materialize_skills.go:196 (LoadAgentCatalog), cmd/gc/skill_integration.go:418 (appendMaterializeSkillsPreStart)."
        },
        {
          "name": "SkillSinkWriter",
          "type": "module",
          "description": "materialize.Run: writes owned symlinks into the vendor sink with an ownership manifest; vendor map claude -> .claude/skills, codex/pi -> .agents/skills, gemini, opencode, mimocode. Source: internal/materialize/skills.go:93 (vendorSinks), internal/materialize/skills.go:106 (VendorSink), internal/materialize/skills.go:512 (Run), internal/materialize/skills.go:451 (ownershipManifest)."
        },
        {
          "name": "MCPCatalogResolver",
          "type": "module",
          "description": "Effective MCP catalog for a session: city/pack layers plus the agent layer from agent.MCPDir (TOML files rendered as templates). Source: internal/materialize/mcp_runtime.go:25 (EffectiveMCPForSession), internal/materialize/mcp_resolve.go:79 (agent.MCPDir), internal/materialize/mcp.go:120 (LoadMCPDir), cmd/gc/mcp_integration.go:103 (loadEffectiveMCPForAgent)."
        },
        {
          "name": "MCPProjectionWriter",
          "type": "module",
          "description": "Builds the provider-native MCP file (Claude .mcp.json, Codex .codex/config.toml, Gemini .gemini/settings.json, Cursor .cursor/mcp.json) and applies it; run in pre_start via `gc internal project-mcp`. Source: internal/materialize/mcp_project.go:49 (BuildMCPProjection), internal/materialize/mcp_project.go:71 (.mcp.json), internal/materialize/mcp_project.go:120 (Apply), cmd/gc/cmd_internal_project_mcp.go:18 (newInternalProjectMCPCmd), cmd/gc/mcp_integration.go:197 (appendProjectMCPPreStart)."
        }
      ]
    },
    {
      "name": "Managed hooks and Claude settings",
      "parent_system": "Gas City engine",
      "type": "service",
      "description": "gc installs provider hook files into work dirs and writes the city's managed Claude settings <city>/.gc/settings.json (embedded defaults merged with <city>/.claude/settings.json, else hooks/claude.json), passed to every gc-launched Claude by --settings. The managed hooks call back into gc: SessionStart(startup) -> gc prime --hook; PreCompact -> gc handoff --auto; UserPromptSubmit -> nudge drain --inject and mail check --inject. Source: internal/hooks/hooks.go:265 (InstallWithResolver), internal/hooks/hooks.go:660 (installClaude), internal/hooks/config/claude.json:7 (SessionStart), internal/config/launch_command.go:241 (--settings).",
